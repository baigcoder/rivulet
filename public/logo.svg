<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#0e0f11"/>
  <!-- Three converging flow lines in electric cyan framing a negative play triangle in the center -->
  <g fill="none" stroke="#6FE3FF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top flow stream -->
    <path d="M 120 140 C 220 140, 260 210, 380 180" stroke-width="36"/>
    <!-- Bottom-left flow stream -->
    <path d="M 120 370 C 180 270, 250 250, 380 340" stroke-width="36"/>
    <!-- Right converging flow stream forming the play peak -->
    <path d="M 380 180 C 430 250, 430 270, 380 340" stroke-width="36"/>
  </g>
  <!-- Sharp negative play triangle counter-shape cutout/overlay -->
  <path d="M 210 180 L 330 256 L 210 332 Z" fill="#6FE3FF"/>
</svg>