<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App ground. Same token as GROUND in themes.ts — the icon sits on the
       native window before any stylesheet, so this has to be the colour. -->
  <rect width="512" height="512" rx="100" fill="#0e0f11"/>
  <!-- Play is two straight edges to a point. The trailing edge is one rivulet
       S, not three strokes and not a round-join paw. Back corners sit inboard
       so they stay thick at 32px. -->
  <path
    fill="#6FE3FF"
    d="M208 152
       C250 204 250 228 176 256
       C250 284 250 308 208 360
       L436 256
       Z"
  />
</svg>
