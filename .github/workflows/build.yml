# Builds the same bundles as release.yml, without a tag and without a release:
# the files are attached to the run as artifacts for a week. It is how a branch
# is shown to build on every platform before anyone tags it.
#
#   Actions → Build → Run workflow   (pick the branch and the platforms)
#   or add the `build` label to a pull request
#
# Nothing here publishes anything. The Android APKs are signed with the release
# keystore when the secrets are reachable (a manual run, or a pull request from
# this repository), so a test APK installs over a released one and back.
name: Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: What to build
        type: choice
        default: all
        options: [all, android, desktop, linux, windows, macos]
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  TMDB_API: ${{ secrets.TMDB_API }}

jobs:
  # One place that turns the trigger into "which jobs run", so a label and a
  # manual run mean the same thing.
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build'
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.p.outputs.desktop }}
      android: ${{ steps.p.outputs.android }}
    steps:
      - id: p
        env:
          PICK: ${{ inputs.platforms || 'all' }}
        run: |
          case "$PICK" in
            all)     d='["ubuntu-22.04","windows-latest","macos-latest"]'; a=true ;;
            android) d='[]'; a=true ;;
            desktop) d='["ubuntu-22.04","windows-latest","macos-latest"]'; a=false ;;
            linux)   d='["ubuntu-22.04"]'; a=false ;;
            windows) d='["windows-latest"]'; a=false ;;
            macos)   d='["macos-latest"]'; a=false ;;
          esac
          echo "desktop=$d" >> "$GITHUB_OUTPUT"
          echo "android=$a" >> "$GITHUB_OUTPUT"

  desktop:
    needs: plan
    if: needs.plan.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: bun install --frozen-lockfile
      - if: runner.os == 'Windows'
        run: bun scripts/build/mpv.ts
      - if: runner.os == 'macOS'
        run: brew install mpv

      # No tagName and no releaseId: tauri-action builds and uploads nothing.
      - uses: tauri-apps/tauri-action@v0
        env:
          NO_STRIP: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The same fix-ups the release makes, so what is tested is what ships.
      - if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun scripts/build/linux/appimage.ts
      - if: runner.os == 'macOS'
        run: bun scripts/build/macos/bundle-dylib.ts src-tauri/target/release/bundle/macos/Rivulet.app

      - uses: actions/upload-artifact@v4
        with:
          name: rivulet-${{ runner.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          # armv7 is the TV sets: many still run a 32-bit userspace.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # Same keystore as the release, when it is reachable; otherwise a
      # throwaway debug key, and the APK won't install over a released one.
      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/rivulet.jks"
          else
            echo "::warning::No ANDROID_KEYSTORE secret here: the APK is debug-signed and will not upgrade a released install."
          fi

      - run: bun run build:android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rivulet.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Check every APK is signed
        run: |
          out=src-tauri/gen/android/app/build/outputs/apk
          ls "$out"/*/release/*.apk
          for apk in "$out"/*/release/app-*-release.apk; do
            echo "== $apk"
            "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rivulet-android
          retention-days: 7
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/*/release/app-*-release.apk
