[package]
name = "rustls-platform-verifier"
version = "0.7.0"
edition = "2021"
description = "Patched rustls-platform-verifier: uses bundled webpki root certs on Android instead of JNI"

[lib]
name = "rustls_platform_verifier"
path = "src/lib.rs"

[dependencies]
log = "0.4"
rustls = { version = "0.23", features = [ "std" ], default-features = false }
rustls-webpki = { version = "0.103", default-features = false }
webpki-root-certs = "1"
